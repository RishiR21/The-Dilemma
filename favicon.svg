<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c28"/>
      <stop offset="85%" stop-color="#06080d"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <!-- Emerald Split Gradient -->
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Crimson Steal Gradient -->
    <linearGradient id="favCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Gold Core Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Golden Perimeter Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#favGold)" stroke-width="2" opacity="0.9"/>

  <!-- Left Semicircle / Split Arc (Emerald Green) -->
  <path d="M 32,8 A 24,24 0 0,0 32,56 Z" fill="url(#favEmerald)" filter="url(#favGlow)"/>

  <!-- Right Semicircle / Steal Arc (Crimson Red) -->
  <path d="M 32,8 A 24,24 0 0,1 32,56 Z" fill="url(#favCrimson)" filter="url(#favGlow)"/>

  <!-- Central Split Cut Line -->
  <line x1="32" y1="7" x2="32" y2="57" stroke="#06080d" stroke-width="2.5"/>

  <!-- Central Golden Core Ball -->
  <circle cx="32" cy="32" r="11" fill="url(#favGold)" stroke="#06080d" stroke-width="2"/>
  <circle cx="32" cy="32" r="9" fill="#0b0f17"/>

  <!-- Greek Delta (Δ) Dilemma Glyph -->
  <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="url(#favGold)" text-anchor="middle">Δ</text>

  <!-- Specular Highlights -->
  <circle cx="28" cy="14" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="30" cy="27" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
