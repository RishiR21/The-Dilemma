<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="50%" stop-color="#0f131a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cyberEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tickerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="hostileCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Card Body -->
  <rect width="512" height="512" rx="100" fill="url(#bgObsidian)"/>
  
  <!-- Subtle Trading Grid Lines -->
  <line x1="60" y1="140" x2="452" y2="140" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="60" y1="372" x2="452" y2="372" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="256" y1="60" x2="256" y2="452" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Candlestick / Ticker Visuals -->
  <line x1="140" y1="180" x2="140" y2="270" stroke="#10b981" stroke-width="2"/>
  <rect x="132" y="195" width="16" height="50" rx="3" fill="#10b981" opacity="0.4"/>

  <line x1="372" y1="160" x2="372" y2="280" stroke="#ef4444" stroke-width="2"/>
  <rect x="364" y="180" width="16" height="65" rx="3" fill="#ef4444" opacity="0.4"/>

  <!-- Center Hexagonal Deal Keystone / Token -->
  <polygon points="256,110 370,175 370,305 256,370 142,305 142,175" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <polygon points="256,126 354,183 354,297 256,354 158,297 158,183" fill="#0b0f17" stroke="url(#tickerGold)" stroke-width="2"/>

  <!-- Split Delta (Green) vs Steal Delta (Red) Interlock -->
  <path d="M 210,210 L 256,160 L 256,320 Z" fill="url(#cyberEmerald)" opacity="0.9" filter="url(#bloom)"/>
  <path d="M 302,210 L 256,160 L 256,320 Z" fill="url(#hostileCrimson)" opacity="0.9" filter="url(#bloom)"/>

  <!-- Center Core Terminal Emblem -->
  <circle cx="256" cy="240" r="32" fill="#05070a" stroke="#fef08a" stroke-width="2.5"/>
  <text x="256" y="247" font-family="'Courier New', monospace" font-weight="900" font-size="20" fill="#fef08a" text-anchor="middle">Δ</text>

  <!-- Typography -->
  <text x="256" y="415" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="6">THE DILEMMA</text>
  <text x="256" y="445" font-family="'Courier New', monospace" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="4">[ LIQUIDITY EXECUTION ]</text>
</svg>
